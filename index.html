<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZERO 영어 스터디 · AI 언어 코치</title>
    <meta name="description" content="AI 언어 코치와 함께하는 3개월 회화 마스터 시스템. 맞춤 학습 로드맵, 회화·발음 훈련, 어휘·문법, 진도 분석." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="boot"><div class="spinner"></div><p>불러오는 중…</p></div>
    </div>
    <script type="module" src="./js/app.js"></script>
    <script>
      // 모듈 로딩 실패(네트워크/CDN 차단 등) 시 안내
      window.__booted = false;
      window.addEventListener("error", (e) => {
        if (e.target && e.target.tagName === "SCRIPT") window.__loadErr = true;
      }, true);
      setTimeout(() => {
        const boot = document.querySelector("#app .boot");
        if (boot && !window.__booted) {
          boot.innerHTML =
            '<p style="max-width:420px;text-align:center;line-height:1.6">' +
            "앱을 불러오지 못했습니다. 네트워크 연결을 확인하고 새로고침해 주세요.<br>" +
            "(Firebase/Gemini 리소스에 접근할 수 있어야 합니다.)</p>";
        }
      }, 12000);
    </script>
  </body>
</html>
